  <script>
    let cashBalance = 0.00;
    let softBalance = 0.00;
    let sl = 1;

    // Load data from localStorage on page load
    window.onload = () => {
      const savedData = JSON.parse(localStorage.getItem('transactions')) || [];
      const highlightedRows = JSON.parse(localStorage.getItem('highlightedRows')) || [];
     
      if (savedData.length) {
        savedData.slice(-100000000000).forEach((entry) => addRow(entry, false, highlightedRows));
        sl = savedData.length + 1;
        cashBalance = parseFloat(localStorage.getItem('cashBalance')) || 0.00;
        softBalance = parseFloat(localStorage.getItem('softBalance')) || 0.00;
        document.getElementById('cashBalance').textContent = cashBalance.toFixed(2);
        document.getElementById('softBalance').textContent = softBalance.toFixed(2);
      }
    };

    function updateBalance() {
      const sellReportText = document.getElementById('sellReportText').value.trim();
      const sellReportAmount = parseFloat(document.getElementById('sellReportAmount').value) || 0;
      const noteText = document.getElementById('noteText').value.trim();
      const noteAmount = parseFloat(document.getElementById('noteAmount').value) || 0;
      const expenseText = document.getElementById('expenseText').value.trim();
      const expenseAmount = parseFloat(document.getElementById('expenseAmount').value) || 0;
      const withdrawAmount = parseFloat(document.getElementById('withdrawAmount').value) || 0;
      const withdrawOption = document.getElementById('withdrawOption').value;
      const currentDate = new Date().toLocaleDateString();

      softBalance += sellReportAmount;
      cashBalance += sellReportAmount;
      cashBalance += noteAmount;
      cashBalance -= expenseAmount;

      if (withdrawOption === "cash") cashBalance -= withdrawAmount;
      else if (withdrawOption === "software") softBalance -= withdrawAmount;
      else if (withdrawOption === "both") {
        cashBalance -= withdrawAmount;
        softBalance -= withdrawAmount;
      }

      document.getElementById('cashBalance').textContent = cashBalance.toFixed(2);
      document.getElementById('softBalance').textContent = softBalance.toFixed(2);

      const entry = {
        sl: sl++,
        date: currentDate,
        sellReport: `${sellReportText} (${sellReportAmount.toFixed(2)})`,
        note: `${noteText} (${noteAmount.toFixed(2)})`,
        expense: `${expenseText} (${expenseAmount.toFixed(2)})`,
        withdraw: withdrawAmount.toFixed(2),
        withdrawOption: withdrawOption,
        updatedCash: cashBalance.toFixed(2),
        updatedSoft: softBalance.toFixed(2),
      };

      addRow(entry, true);

      // Clear inputs
      document.querySelectorAll('input').forEach((input) => (input.value = ''));
    }

    function addRow(entry, save = false, highlightedRows = []) {
      const table = document.getElementById('reportTable');
      const row = table.insertRow();
      row.innerHTML = `
        <td>${entry.sl}</td>
        <td>${entry.date}</td>
        <td>${entry.sellReport}</td>
        <td>${entry.note}</td>
        <td>${entry.expense}</td>
        <td>${entry.withdraw}</td>
        <td>${entry.withdrawOption}</td>
        <td>${entry.updatedCash}</td>
        <td>${entry.updatedSoft}</td>
        <td>



          <button class="action-btn" onclick="toggleHighlight(this, ${entry.sl})">Highlight</button>
          <button class="acton-btn" onclick="deleteRow(this, ${entry.sl})">Delete</button>
        </td>
      `;

      if (highlightedRows.includes(entry.sl)) {
        row.classList.add('highlight');
      }

      if (save) {
        saveData(entry);
      }
    }

    function toggleHighlight(button, sl) {
      const row = button.parentElement.parentElement;
      row.classList.toggle('highlight');
      const highlightedRows = JSON.parse(localStorage.getItem('highlightedRows')) || [];
     
      if (row.classList.contains('highlight')) {
        highlightedRows.push(sl);
      } else {
        const index = highlightedRows.indexOf(sl);
        if (index !== -1) highlightedRows.splice(index, 1);
      }
      localStorage.setItem('highlightedRows', JSON.stringify(highlightedRows));
    }

    function saveData(entry) {
      const savedData = JSON.parse(localStorage.getItem('transactions')) || [];
      savedData.push(entry);
      localStorage.setItem('transactions', JSON.stringify(savedData));
      localStorage.setItem('cashBalance', cashBalance.toFixed(2));
      localStorage.setItem('softBalance', softBalance.toFixed(2));
    }

    function deleteRow(button, sl) {
      const row = button.parentElement.parentElement;
      row.remove();
      let savedData = JSON.parse(localStorage.getItem('transactions')) || [];
      savedData = savedData.filter((entry) => entry.sl !== sl);
      localStorage.setItem('transactions', JSON.stringify(savedData));
    }
  </script>
</body>
